version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    platform: ${API_PLATFORM:-linux/amd64}
    ports:
      - "9000:9000"
    environment:
      LOCAL_API_PORT: "9000"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_DATABASE: app
    volumes:
      - .:/app
      - go-build-cache:/root/.cache/go-build
      - mod-cache:/go/pkg/mod
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    platform: ${MYSQL_PLATFORM:-linux/arm64/v8}
    command: ["mysqld", "--default-authentication-plugin=mysql_native_password"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
  go-build-cache:
  mod-cache:
